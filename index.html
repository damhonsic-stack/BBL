<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1EC">
<title>Glute Focus – deník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1EC; --card:#FFFFFF; --ink:#1B1A1F; --ink2:#2A2730; --mu:#5A5560; --mu2:#6E6872;
  --line:#DCD2CF; --line2:#CFC5C2; --berry:#8C1D40; --berry2:#5E1229; --blush:#E9D3D0; --blush2:#F3E6E3;
  --up:#1E7A4C; --upbg:#E2F1E8; --dn:#B3261E; --dnbg:#F7E1DF;
  --disp:Oswald,"Arial Narrow",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 100px)}
.runner{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.store{display:inline-flex;align-items:center;gap:6px;letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mu2)} .dot.ok{background:var(--up)} .dot.loc{background:#C98A1B}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.chipday{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:999px;color:#fff;background:var(--berry)}
.chipday.u{background:var(--ink)}
.disp{font-family:var(--disp);font-weight:700;text-transform:uppercase;line-height:.95;letter-spacing:-.005em;margin:0}
h1.disp{font-size:64px;margin-top:10px}
h2.sec{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:28px;line-height:1.1;margin:30px 0 12px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.subhead{font-size:17px;font-weight:600;color:var(--berry);margin-top:6px}
.muted{color:var(--mu)} .small{font-size:13px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:16px}
.seg button{min-height:46px;border-radius:10px;border:1.5px solid var(--line2);background:var(--card);font-family:var(--disp);font-weight:600;font-size:17px;color:var(--ink);text-transform:uppercase}
.seg button.on{background:var(--berry);border-color:var(--berry);color:#fff}
.seg button.next{border-color:var(--berry);border-style:dashed}
.week{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.week .bars{display:flex;gap:5px;flex:1}
.week .bars i{flex:1;height:10px;border-radius:3px;background:var(--blush)}
.week .bars i.f{background:var(--berry)}
.week b{font-family:var(--disp);font-size:24px;font-weight:600}
.rec{margin-top:12px;background:var(--blush);border-radius:12px;padding:14px}
.rec .lbl{color:var(--berry2)}
.rec .row{display:flex;gap:12px;align-items:flex-end;margin-top:8px}
.energy{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;flex:1}
.energy button{min-height:44px;border-radius:9px;border:1.5px solid rgba(94,18,41,.25);background:rgba(255,255,255,.6);font-weight:800;color:var(--berry2)}
.energy button.on{background:var(--berry);border-color:var(--berry);color:#fff}
.sleep{width:96px}
.sleep label,.energyw label{display:block;font-size:12px;font-weight:600;color:var(--berry2);margin-bottom:5px}
.energyw{flex:1}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.exhead{display:flex;align-items:flex-start;gap:10px}
.exnum{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--berry);min-width:28px;line-height:1.1}
.exname{font-weight:700;font-size:16px;line-height:1.3}
.exmeta{font-size:13px;color:var(--mu);margin-top:3px}
.exbtns{display:flex;gap:6px}
.mini{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--ink);padding:0 8px;font-size:12px;font-weight:700}
.mini svg{width:18px;height:18px}
.rename{display:flex;gap:6px;margin-top:10px}
.rename input{flex:1;min-width:0;height:44px;border-radius:10px;border:1.5px solid var(--berry);background:var(--paper);padding:0 12px}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:76px minmax(0,1fr) 14px minmax(0,1fr) 34px;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-align:center;border-radius:4px;padding:5px 0}
.tag.top{background:var(--berry);color:#fff} .tag.bo{background:var(--blush);color:var(--berry2)} .tag.s{background:var(--paper);color:var(--mu);border:1px solid var(--line)}
.inp{position:relative}
.inp input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--paper);padding:0 32px 0 12px;font-size:17px;font-weight:700}
.inp input::placeholder{color:#9A9296;font-weight:500}
.inp input:focus,.field input:focus,.rec input:focus{outline:none;border-color:var(--berry);box-shadow:0 0 0 3px rgba(140,29,64,.15)}
.inp span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mu2);pointer-events:none}
.x{color:var(--mu2);text-align:center;font-size:13px}
.rm{width:34px;height:34px;border-radius:9px;border:none;background:transparent;color:var(--mu2);display:grid;place-items:center}
.rm svg{width:16px;height:16px}
.addset{margin-top:8px;height:40px;border-radius:10px;border:1.5px dashed var(--line2);background:transparent;color:var(--mu);width:100%;font-size:13px;font-weight:600}
.last{margin-top:10px;font-size:13px;color:var(--mu);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.pill.up{background:var(--upbg);color:var(--up)} .pill.dn{background:var(--dnbg);color:var(--dn)} .pill.eq{background:var(--paper);color:var(--mu);border:1px solid var(--line)} .pill.pr{background:var(--berry);color:#fff}
.btn{width:100%;min-height:54px;border-radius:12px;border:none;background:var(--berry);color:#fff;font-family:var(--disp);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-size:16px}
.btn.sm{min-height:46px;font-size:16px;margin-top:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(246,241,236,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1.5px solid var(--ink);padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);z-index:20}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{min-height:52px;border-radius:12px;border:none;background:transparent;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase}
.tabs button svg{width:20px;height:20px}
.tabs button.on{color:#fff;background:var(--berry)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-top:2px solid var(--ink);padding-top:10px}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:700}
.stat .v{font-family:var(--disp);font-size:30px;font-weight:600;line-height:1.1;margin-top:3px}
.stat .d{font-size:12px;color:var(--mu)}
.up{color:var(--up)} .dn{color:var(--dn)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--paper);padding:0 12px;font-size:17px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.chart{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px 6px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);padding:4px 8px 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:8px}
.chips button{flex:none;min-height:40px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);padding:0 14px;font-size:13px;font-weight:700;color:var(--ink)}
.chips button.on{border-color:var(--berry);background:var(--berry);color:#fff}
.jump{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;margin:10px -2px 0}
table.m{width:100%;border-collapse:collapse;font-size:14px}
table.m th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:700;padding:8px 4px;border-bottom:2px solid var(--ink)}
table.m td{padding:10px 4px;border-bottom:1px solid var(--line2)}
table.m td.n,table.m th.n{text-align:right;font-variant-numeric:tabular-nums}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.list .it:last-child{border-bottom:none}
.empty{color:var(--mu);font-size:14px;padding:10px 0}
.note{font-size:13px;color:var(--ink2);background:var(--blush2);border-radius:12px;padding:12px;margin-top:10px}
.warn{background:#FBEFD9;color:#5C3D05}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.sheetbg{position:fixed;inset:0;background:rgba(27,26,31,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:90vh;overflow:auto;padding:16px 18px calc(env(safe-area-inset-bottom) + 22px)}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sheet h3{margin:0;font-family:var(--disp);font-size:26px;font-weight:600;text-transform:uppercase;line-height:1.05}
textarea.bk{width:100%;min-height:130px;border-radius:10px;border:1px solid var(--line2);background:var(--card);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.del{color:var(--dn)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.photos button{padding:0;border:none;background:var(--blush);border-radius:10px;overflow:hidden;aspect-ratio:3/4;position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:6px;bottom:6px;background:rgba(27,26,31,.75);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmp figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.cmp figcaption{font-size:12px;font-weight:700;padding:6px 8px;color:var(--mu)}
.file{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bigimg{width:100%;border-radius:12px;display:block;margin-top:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;width:100%;min-height:48px;padding:8px 10px;border:none;border-bottom:1px solid var(--line2);background:transparent;text-align:left;border-radius:8px}
.mrow:last-child{border-bottom:none}
.mrow span{font-variant-numeric:tabular-nums}
.mrow span.n{text-align:right}
.mrow.on{background:var(--berry);color:#fff}
.mrow.on .muted{color:#F3D6DE}
.mhead{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));gap:6px;padding:0 10px 8px;border-bottom:2px solid var(--ink);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:700}
.mhead span.n{text-align:right}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:4px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;min-width:82px;min-height:58px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);padding:7px 10px;text-align:left;display:flex;flex-direction:column;gap:1px}
.mchip b{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.mchip span{font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.1}
.mchip small{font-size:11px;font-weight:700}
.mchip.on{background:var(--berry);border-color:var(--berry);color:#fff}
.mchip.on b,.mchip.on small{color:#F3D6DE}
.secrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:30px 0 10px}
.secrow h2.sec{margin:0}
.addbtn{min-height:44px;border-radius:999px;border:none;background:var(--berry);color:#fff;font-weight:700;font-size:14px;padding:0 16px;display:inline-flex;align-items:center;gap:6px}
.linkbtn{border:none;background:transparent;color:var(--berry);font-weight:700;font-size:14px;min-height:44px;padding:0}
.sug{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--blush2);border-radius:10px;padding:8px 10px;font-size:13px}
.sug b{color:var(--berry2)}
.sug button{min-height:36px;border-radius:999px;border:none;background:var(--berry);color:#fff;font-weight:700;font-size:12px;padding:0 12px;margin-left:auto}
.warm{margin-top:8px;border:1.5px dashed var(--line2);border-radius:10px;padding:10px;font-size:14px}
.warm ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.warm li b{font-variant-numeric:tabular-nums}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 8px 4px}
.ctitle b{font-family:var(--disp);font-size:20px;font-weight:600;text-transform:uppercase}
.cempty{height:150px;display:grid;place-items:center;color:var(--mu);font-size:14px;text-align:center;padding:0 20px}
.wbars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px;padding:0 4px}
.wbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wbars i{width:100%;border-radius:4px 4px 0 0;background:var(--berry);display:block;min-height:2px}
.wbars i.z{background:var(--blush)}
.wbars small{font-size:10px;color:var(--mu)}
.wbars b{font-size:11px}
</style>
</head>

function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}

function chain(id,fn){var p=(S.chains[id]||Promise.resolve()).then(fn,fn);S.chains[id]=p.catch(function(){});return p}
function fallbackLocal(){if(S.mode!=='local'){S.mode='local';S.col=null;S.pcol=null;P.loaded=false;renderSoon();toast('Cloud nejde – ukládám do tohoto zařízení')}}
function onWriteErr(e){
  if(!e)return;
  if(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked'||e.code==='capability_disabled')fallbackLocal();
  else if(e.code==='quota_exceeded')toast('Úložiště je plné');
}
function put(id,data){
  S.docs[id]=data; persistLocal();
  if(S.mode==='cloud'&&S.col){
    return chain(id,function(){return S.col.doc(id).set(data)}).catch(function(e){
      if(e&&e.code==='unavailable')return new Promise(function(r){setTimeout(r,800+Math.random()*800)}).then(function(){return S.col.doc(id).set(data)}).catch(onWriteErr);
      onWriteErr(e);
    });
  }
  return Promise.resolve();
}
function del(id){
  delete S.docs[id]; persistLocal();
  if(S.mode==='cloud'&&S.col)return chain(id,function(){return S.col.doc(id).delete()}).catch(function(){});
  return Promise.resolve();
}

function initStore(){
  var done=false, tries=0;
  var timer=setTimeout(function(){if(!done){done=true;S.mode='local';renderSoon()}},10000);
  (function wait(){
    if(window.claude&&typeof window.claude.use==='function'){go();return}
    if(++tries>15){clearTimeout(timer);done=true;S.mode='local';renderSoon();return}
    setTimeout(wait,200);
  })();
  function go(){
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1]; if(!db||!user)throw 0;
      return user.id().then(function(uid){
        if(!uid)throw 0;
        var col=db.collection('data/users/'+uid);
        var pcol=db.doc('data/users/'+uid+'/media').collection('photos');
        var first=true;
        col.onSnapshot(function(snap){
          if(snap.metadata.fromCache&&first)return;
          var cloud={}; snap.docs.forEach(function(d){cloud[d.id]=d.data()});
          if(first){
            first=false;done=true;clearTimeout(timer);
            S.col=col;S.pcol=pcol;S.mode='cloud';P.loaded=false;
            var ids=Object.keys(S.docs);
            if(snap.empty&&ids.length){
              var q=Promise.resolve();
              ids.forEach(function(id){var data=S.docs[id];q=q.then(function(){return col.doc(id).set(JSON.parse(JSON.stringify(data)))})});
              q.catch(onWriteErr); renderSoon(); return;
            }
          }
          S.docs=cloud; persistLocal(); renderSoon();
        },function(){if(!done){done=true;clearTimeout(timer)}S.mode='local';S.col=null;S.pcol=null;renderSoon()});
      });
    }).catch(function(){if(!done){done=true;clearTimeout(timer)}S.mode='local';renderSoon()});
  }
}

function deletePhoto(id){

function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var tries=[[1100,.78],[900,.7],[750,.62],[600,.55]], out=null;
      for(var i=0;i<tries.length;i++){
        var max=tries[i][0], sc=Math.min(1,max/Math.max(img.width,img.height));
        var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',tries[i][1]); if(out.length<220000)break;
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej()};
    img.src=url;
  });
}

function exName(id){var c=cfg();return (c.names&&c.names[id])||EXDEF[id].n}

function num(v){if(v===null||v===undefined)return NaN;var s=String(v).replace(',','.').trim();if(s==='')return NaN;return parseFloat(s)}
function fmt(n,d){if(!isFinite(n))return '–';var p=Math.pow(10,d==null?1:d);return String(Math.round(n*p)/p).replace('.',',')}
function sgn(n,d){if(!isFinite(n))return '–';return (n>0?'+':n<0?'−':'±')+fmt(Math.abs(n),d)}
function e1rm(w,r){return w*(1+r/30)}
function pad2(n){return String(n).padStart(2,'0')}
function isoDay(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function today(){return isoDay(new Date())}
function dLabel(iso){var p=String(iso).slice(0,10).split('-');return parseInt(p[2],10)+'. '+parseInt(p[1],10)+'.'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function localDate(iso){return new Date(iso)}
function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x}
function weekKey(d){return isoDay(weekStart(d))}

function bestSet(sets,assist){
  var best=null;
  (sets||[]).forEach(function(s){var w=num(s.w),r=num(s.r);if(!isFinite(r)||r<=0)return;if(!isFinite(w))w=0;var sc=assist?(-w*100+r):e1rm(w,r);if(!best||sc>best.sc)best={w:w,r:r,sc:sc}});
  return best;
}
function history(exId){var out=[];workouts().forEach(function(w){var s=w.sets[exId];if(s&&s.length)out.push({date:w.date,sets:s,id:w.id})});return out}
function compare(cur,prev,assist){
  if(!cur||!prev)return null;
  if(assist){if(cur.w<prev.w||(cur.w===prev.w&&cur.r>prev.r))return {cls:'up',txt:'↑ posun'};if(cur.w===prev.w&&cur.r===prev.r)return {cls:'eq',txt:'= stejně'};return {cls:'dn',txt:'↓ méně'}}
  var d=cur.sc-prev.sc; if(Math.abs(d)<0.05)return {cls:'eq',txt:'= stejně'};
  return {cls:d>0?'up':'dn',txt:(d>0?'↑ ':'↓ ')+sgn(d,1)+' kg'};
}
var SMALL=['lat1','lat2','rd','bic','tri1','tri2'];
function stepOf(e){return SMALL.indexOf(e.id)>=0?1:2.5}
function rangeFor(e,j){
  if(e.tb)return j===0?[4,6]:[8,10];
  var part=e.t.split('·').slice(1).join('·'),m=part.match(/(\d+)–(\d+)/);
  return m?[+m[1],+m[2]]:null;
}
function roundTo(x,st){return Math.round(x/st)*st}
// návrh váhy pro každou plánovanou sérii podle minula
function suggest(e){
  var hist=history(e.id);if(!hist.length)return null;
  var prev=hist[hist.length-1].sets,out=[],any=false,st=stepOf(e);
  var n=(draft&&draft.sets[e.id])?draft.sets[e.id].length:prev.length;
  for(var j=0;j<n;j++){
    var ps=prev[j]||prev[prev.length-1],rg=rangeFor(e,j);
    var w=num(ps.w),r=num(ps.r);
    if(!isFinite(w)||!isFinite(r)||!rg){out.push(null);continue}
    var nw=w,why='drž váhu';
    if(r>=rg[1]){nw=e.assist?Math.max(0,w-st):w+st;why=e.assist?'méně asistence':'přidej';any=true}
    else if(r<rg[0]&&!e.assist&&w>0){why='drž váhu, dober opakování'}
    out.push({w:Math.round(nw*100)/100,why:why,up:nw!==w});
  }
  return {sets:out,any:any};
}
function topTarget(e){
  var d=draft&&draft.sets[e.id]&&draft.sets[e.id][0];
  var tw=d?num(d.w):NaN; if(isFinite(tw)&&tw>0)return {w:tw,src:'zapsaná'};
  var sg=suggest(e);if(sg&&sg.sets[0])return {w:sg.sets[0].w,src:'návrh'};
  return null;
}
function warmCount(e){var m=String(e.w).match(/(\d+)(?:–(\d+))?/);if(!m)return 0;return +(m[2]||m[1])}
function warmups(e,top){
  var n=warmCount(e);if(!n||!top)return [];
  var P={1:[[.6,6]],2:[[.5,8],[.75,4]],3:[[.45,8],[.65,5],[.85,2]],4:[[.4,8],[.55,5],[.7,3],[.85,2]]}[Math.min(n,4)];
  var st=stepOf(e);
  return P.map(function(x){return {w:Math.max(st,roundTo(top*x[0],st)),r:x[1],pct:Math.round(x[0]*100)}});
}

  var sg=e.assist||hist.length?suggest(e):null;

var revEnergy=null,revCycle=null;

function weekStats(k){

  var ws=workouts().filter(function(w){return weekKey(localDate(w.date))===k});

  var pas=measSeries('pas').filter(function(p){return Date.parse(p.date+'T12:00:00')<end});

  h+='</div></div><div class="field" style="margin-top:10px"><label for="rn" style="color:var(--berry2)">Poznámka (nepovinné)</label><input id="rn" autocomplete="off" maxlength="500" value="'+esc(rv.note||'')+'" placeholder="hlad, stres, bolest…" style="background:#fff;font-size:15px;font-weight:500"></div><button class="btn sm" type="submit">'+(st.rev?'Upravit týden':'Uložit týden')+'</button></form>';
  h+=verdict(st,rv);
  var rs=reviews();
  if(rs.length){
    var sl=rs.filter(function(r){return isFinite(num(r.sleep))}).map(function(r){return {date:r.week,v:num(r.sleep)}});
    var ev=rs.filter(function(r){return r.energy>0}).map(function(r){return {date:r.week,v:r.energy}});
    if(ev.length>1)h+='<div class="chart">'+lineChart([{pts:ev,color:'#8C1D40',w:3,dots:true}],'energie',0,[1,5])+'<div class="legend"><span><i style="background:#8C1D40"></i>energie po týdnech (1–5)</span></div></div>';
    if(sl.length>1)h+='<div class="chart">'+lineChart([{pts:sl,color:'#1B1A1F',w:3,dots:true}],'h',1)+'<div class="legend"><span><i style="background:#1B1A1F"></i>Ø spánek po týdnech (h)</span></div></div>';
    h+='<div class="lbl" style="margin-top:16px">Předchozí týdny</div><div class="panel list">';
    rs.slice().reverse().slice(0,10).forEach(function(r){var t=weekStats(r.week),bits=[t.main+'/'+WEEK_GOAL+' tréninků'+(t.bonus?' (+'+t.bonus+')':'')];if(isFinite(num(r.sleep)))bits.push('spánek '+fmt(num(r.sleep),1)+' h');if(r.energy)bits.push('energie '+r.energy+'/5');if(r.cycle&&r.cycle!=='x'){var cn=CYCLE.filter(function(c){return c.k===r.cycle})[0];if(cn)bits.push(cn.n.toLowerCase())}if(isFinite(t.wNow-t.wPrev))bits.push('váha '+sgn(t.wNow-t.wPrev,1));
      h+='<div class="it"><div><b>'+weekRange(r.week)+'</b><div class="small muted">'+esc(bits.join(' · '))+'</div>'+(r.note?'<div class="small" style="margin-top:2px">'+esc(r.note)+'</div>':'')+'</div></div>'});
    h+='</div>';
  }
  return h;
}
function verdict(st,rv){
  var good=[],bad=[];
  if(st.main>=WEEK_GOAL)good.push('všechny tréninky splněné');else if(st.main>0)bad.push('splněno '+st.main+' z '+WEEK_GOAL+' tréninků');
  var cyc=rv.cycle==='m'||rv.cycle==='pms',info=[];
  if(isFinite(st.wNow-st.wPrev)){var d=st.wNow-st.wPrev,pct=d/st.wPrev*100;if(d<-0.05&&pct>=-0.8)good.push('váha jde dolů rozumným tempem');else if(pct<-0.8)bad.push('váha padá rychle (víc než ~0,8 % za týden) – hrozí ztráta svalů');else if(cyc)info.push('váha se nehnula nebo stoupla, ale v téhle fázi cyklu se běžně zadržuje voda – podle tohoto týdne nehodnoť, rozhodne až příští');else bad.push('váha se tento týden nehnula');}
  if(st.ups>0)good.push('posun ve '+st.ups+' cvicích');
  if(isFinite(num(rv.sleep))){if(num(rv.sleep)<6.5)bad.push('málo spánku');else good.push('dost spánku')}
  if(rv.energy){if(rv.energy<=2&&cyc)info.push('nižší energie kolem menstruace je běžná – klidně ten týden bez Lower 3');else if(rv.energy<=2)bad.push('nízká energie – zvaž vynechat Lower 3 a back-off série');else if(rv.energy>=4)good.push('energie v pohodě – Lower 3 navíc klidně')}
  if(!good.length&&!bad.length&&!info.length)return '';
  function cap(x){return x.charAt(0).toUpperCase()+x.slice(1)}
  good=good.length?[cap(good.join(', '))]:[];bad=bad.length?[cap(bad.join(', '))]:[];info=info.map(cap);
  var h='<div class="note" style="margin-top:10px"><b>Shrnutí:</b> ';
  if(good.length)h+='<span class="up" style="font-weight:700">'+good.join(', ')+'</span>'+(bad.length?'. ':'');
  if(bad.length)h+='<span style="color:var(--dn);font-weight:700">'+bad.join(', ')+'</span>';
  if(info.length)h+=(good.length||bad.length?'. ':'')+'<span>'+info.join('; ')+'</span>';
  return h+'.</div>';
}
/* ---------- GRAF ---------- */
function lineChart(series,unit,dec,fixed,labels){
  var W=340,H=170,pl=36,pr=10,pt=10,pb=24,all=[];
  series.forEach(function(s){s.pts.forEach(function(p){all.push(p)})});
  if(!all.length)return '';
  var ts=all.map(function(p){return Date.parse(p.date)}),vs=all.map(function(p){return p.v});
  var t0=Math.min.apply(null,ts),t1=Math.max.apply(null,ts);if(t1===t0){t0-=864e5;t1+=864e5}
  var v0,v1;if(fixed){v0=fixed[0]-.3;v1=fixed[1]+.3}else{v0=Math.min.apply(null,vs);v1=Math.max.apply(null,vs);var pd=Math.max((v1-v0)*.15,.5);v0-=pd;v1+=pd}
  function X(t){return pl+(t-t0)/(t1-t0)*(W-pl-pr)}function Y(v){return pt+(1-(v-v0)/(v1-v0))*(H-pt-pb)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graf vývoje ('+unit+')">';
  for(var i=0;i<=3;i++){var v=v0+(v1-v0)*i/3,y=Y(v);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E5DCD9" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y+4)+'" fill="#5A5560" font-size="10" text-anchor="end">'+fmt(v,dec==null?1:dec)+'</text>'}
  s+='<text x="'+pl+'" y="'+(H-6)+'" fill="#5A5560" font-size="10">'+dLabel(isoDay(new Date(t0)))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" fill="#5A5560" font-size="10" text-anchor="end">'+dLabel(isoDay(new Date(t1)))+'</text>';
  series.forEach(function(se){var pts=se.pts.map(function(p){return [X(Date.parse(p.date)),Y(p.v)]});
    if(pts.length>1)s+='<polyline fill="none" stroke="'+se.color+'" stroke-width="'+(se.w||2)+'" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>';
    if(se.dots||pts.length===1)pts.forEach(function(p){s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="'+se.color+'"/>'})});
  if(labels){var ps=series[series.length-1].pts;if(ps.length){var lp=ps[ps.length-1],lx=X(Date.parse(lp.date)),ly=Y(lp.v);s+='<text x="'+Math.min(lx,W-pr-2)+'" y="'+Math.max(ly-8,10)+'" fill="#1B1A1F" font-size="11" font-weight="700" text-anchor="end">'+fmt(lp.v,dec==null?1:dec)+'</text>'}}
  return s+'</svg>';
}

function finish(){
  var day=DAYS[draft.day],out={},n=0,prs=0,ups=0;
  day.ex.forEach(function(e){
    var arr=(draft.sets[e.id]||[]).filter(function(s){return isFinite(num(s.r))&&num(s.r)>0}).map(function(s){var w=num(s.w);return {w:isFinite(w)?w:0,r:num(s.r)}});
    if(!arr.length)return;
    var hist=history(e.id),cur=bestSet(arr,e.assist);
    if(hist.length){var c=compare(cur,bestSet(hist[hist.length-1].sets,e.assist),e.assist);if(c&&c.cls==='up')ups++;var ab=null;hist.forEach(function(x){var bb=bestSet(x.sets,e.assist);if(bb&&(!ab||bb.sc>ab.sc))ab=bb});if(ab&&cur.sc>ab.sc+0.01)prs++}
    out[e.id]=arr;n+=arr.length;
  });
  if(!n){toast('Zapiš aspoň jednu sérii (opakování)');return}
  var nxt=day.bonus?nextDay():ROT[(ROT.indexOf(day.id)+1)%ROT.length];
  var doc={date:new Date().toISOString(),day:day.id,sets:out};
  put('w_'+Date.now(),doc).then(function(){return setCfg({next:nxt})});
  S.docs.config=Object.assign({},cfg(),{next:nxt});
  draft=null;try{localStorage.removeItem(LS_DRAFT)}catch(e){}
  render();scrollTop();
  openSheet(bar('Trénink uložen')+'<div class="stats" style="margin-top:10px"><div class="stat"><div class="k">Sérií</div><div class="v">'+n+'</div></div><div class="stat"><div class="k">Posun</div><div class="v up">'+ups+'</div><div class="d">cviků</div></div><div class="stat"><div class="k">Osobáky</div><div class="v" style="color:var(--berry)">'+prs+'</div></div></div><div class="note">Tento týden: <b>'+thisWeekCount()+' / '+WEEK_GOAL+'</b> · příště <b>'+DAYS[nxt].name+'</b> – '+DAYS[nxt].sub+'</div><button class="btn" type="button" data-act="close">Hotovo</button>');
}

render();
initStore();
})();
</script>
